<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Games Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1c1c1e;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    #ton-connect-button {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Cookie Games</h1>
  <p>Добро пожаловать в игру!</p>

  <button onclick="buyStars(50)">Купить 50 Stars ⭐️</button>

  <div id="ton-connect-button"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://cookie-games-bot.netlify.app/tonconnect-manifest.json',
      buttonRootId: 'ton-connect-button'
    });

    async function buyStars(amount) {
      const userId = tg.initDataUnsafe?.user?.id || 123456;
      
      const response = await fetch('https://ВАШ-БЭКЕНД.onrender.com/create-stars-invoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, amountStars: amount })
      });
      
      const data = await response.json();
      
      if (data.invoiceUrl) {
        tg.openInvoice(data.invoiceUrl, (status) => {
          if (status === 'paid') {
            alert('Оплата прошла успешно!');
          }
        });
      }
    }
  </script>
</body>
</html>
